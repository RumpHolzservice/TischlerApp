<style>
    html, body, #root { margin:0; padding:0; min-height:100%; }
    body { background:#f5f0e8; }
    * { box-sizing:border-box; }
    a { color:inherit; }
    button, input, select, textarea { font:inherit; }

    /* PIN Screen */
    #pin-screen {
      position:fixed; inset:0; background:#2b2217;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:9999; padding:32px 24px;
    }
    #pin-screen.hidden { display:none; }
    .pin-logo { font-size:48px; margin-bottom:8px; }
    .pin-title { color:#f5f0e8; font-size:22px; font-weight:700; font-family:Georgia,serif; letter-spacing:1px; margin-bottom:4px; }
    .pin-sub { color:#8b7355; font-size:13px; margin-bottom:36px; }
    .pin-dots { display:flex; gap:12px; margin-bottom:28px; }
    .pin-dot { width:16px; height:16px; border-radius:50%; background:#8b7355; transition:background .15s; }
    .pin-dot.filled { background:#d4a017; }
    .pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:240px; }
    .pin-btn {
      background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
      border-radius:12px; color:#f5f0e8; font-size:24px; font-weight:700;
      padding:16px; cursor:pointer; font-family:Georgia,serif;
      transition:background .1s; user-select:none;
    }
    .pin-btn:active { background:rgba(212,160,23,0.35); }
    .pin-btn.del { font-size:18px; }
    .pin-error { color:#e07070; font-size:13px; margin-top:16px; min-height:20px; }
    .pin-hint { color:#555; font-size:11px; margin-top:20px; }

    /* ── Montagebericht Druck-Layout ── */
    @media print {
      body > *:not(#mb-print) { display:none !important; }
      #mb-print {
        display:block !important; position:static !important;
        font-family:Arial,sans-serif; font-size:10pt; color:#000;
        padding:0; margin:0;
      }
    }
    #mb-print { display:none; }
  </style>

<script>
    // Globaler Fehler-Catcher – zeigt Fehler statt weißer Seite
    window.onerror = function(msg, src, line, col, err) {
      const root = document.getElementById("root");
      if (root && !root.innerHTML.trim()) {
        root.innerHTML = `<div style="padding:24px;font-family:Georgia,serif;max-width:520px;margin:30px auto">
          <div style="font-size:28px;margin-bottom:10px">⚠️</div>
          <div style="font-size:17px;font-weight:700;margin-bottom:8px">App konnte nicht starten</div>
          <div style="font-size:13px;color:#666;margin-bottom:16px;line-height:1.6">
            <strong>Fehler:</strong> ${msg}<br>
            <small style="color:#aaa">Zeile ${line}</small>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button onclick="localStorage.clear();location.reload()"
              style="background:#c0392b;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer">
              🗑 Cache löschen & neu starten
            </button>
            <button onclick="location.reload()"
              style="background:#2b2217;color:#f5f0e8;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer">
              🔄 Neu laden
            </button>
          </div>
        </div>`;
      }
    };
  </script>
<script>
    // ── PIN Logik ──────────────────────────────────────────────────────────────
    const PIN_KEY = "hr_pin";
    const SESSION_KEY = "hr_session";
    let pinInput = "";
    let settingPin = false;
    let newPinBuffer = "";

    function pinPress(val) {
      const storedPin = localStorage.getItem(PIN_KEY);
      const err = document.getElementById("pinError");
      const hint = document.getElementById("pinHint");

      // PIN ändern
      if (val === "del") {
        settingPin = true; newPinBuffer = ""; pinInput = "";
        hint.textContent = "Neuen 4-stelligen PIN eingeben:";
        err.textContent = ""; updateDots(); return;
      }
      if (val === "back") { pinInput = pinInput.slice(0,-1); updateDots(); return; }

      pinInput += val;
      updateDots();

      if (pinInput.length < 4) return;

      if (settingPin) {
        if (!newPinBuffer) {
          newPinBuffer = pinInput; pinInput = "";
          hint.textContent = "PIN wiederholen:"; updateDots(); return;
        }
        if (newPinBuffer === pinInput) {
          localStorage.setItem(PIN_KEY, pinInput);
          sessionStorage.setItem(SESSION_KEY, "1");
          unlock(); return;
        } else {
          err.textContent = "PINs stimmen nicht überein – nochmal:";
          pinInput = ""; newPinBuffer = ""; updateDots(); return;
        }
      }

      // Erster Start – PIN setzen
      if (!storedPin) {
        if (!newPinBuffer) {
          newPinBuffer = pinInput; pinInput = "";
          hint.textContent = "PIN wiederholen:"; err.textContent=""; updateDots(); return;
        }
        if (newPinBuffer === pinInput) {
          localStorage.setItem(PIN_KEY, pinInput);
          sessionStorage.setItem(SESSION_KEY, "1");
          unlock(); return;
        } else {
          err.textContent = "PINs stimmen nicht überein – nochmal:";
          pinInput = ""; newPinBuffer = ""; updateDots(); return;
        }
      }

      // PIN prüfen
      if (pinInput === storedPin) {
        sessionStorage.setItem(SESSION_KEY, "1");
        unlock();
      } else {
        err.textContent = "Falscher PIN – nochmal versuchen";
        pinInput = ""; updateDots();
      }
    }

    function updateDots() {
      document.querySelectorAll(".pin-dot").forEach((d,i) => {
        d.classList.toggle("filled", i < pinInput.length);
      });
    }

    function unlock() {
      document.getElementById("pin-screen").classList.add("hidden");
    }

    // Session check – nach Entsperren in dieser Sitzung nicht mehr fragen
    window.addEventListener("DOMContentLoaded", () => {
      const storedPin = localStorage.getItem(PIN_KEY);
      if (sessionStorage.getItem(SESSION_KEY) === "1") { unlock(); return; }
      if (!storedPin) {
        document.getElementById("pinHint").textContent = "Ersten 4-stelligen PIN festlegen:";
      }
    });

    // Service Worker registrieren
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/TischlerApp/sw.js", { scope: "/TischlerApp/" }).catch(()=>{});
    }
  </script>

    return {
        summary: `${termin.titel}${projektKunde ? " – " + projektKunde : ""}`,
        location: projektAdresse || "",
        description: `Typ: ${termin.typ || ""}\nKunde: ${projektKunde || ""}\n${termin.notiz || ""}`.trim(),
        start: { dateTime: `${datum}T${pad(h)}:${pad(m)}:00`, timeZone: "Europe/Berlin" },

}
